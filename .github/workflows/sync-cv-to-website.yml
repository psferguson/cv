name: Sync CV to website

on:
  push:
    branches: [main]
    paths:
      - ferguson_peter_cv.pdf
      - ferguson_publications.bib
      - scripts/publications.yaml
      - scripts/generate_publications_md.py
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cv repo
        uses: actions/checkout@v4
        with:
          path: cv

      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          repository: psferguson/psferguson.github.io
          ref: main
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate publications page
        working-directory: cv
        run: |
          pip install pybtex pyyaml
          python scripts/generate_publications_md.py

      - name: Copy CV and publications page, push if changed
        working-directory: website
        run: |
          cp ../cv/ferguson_peter_cv.pdf public/ferguson_peter_cv.pdf
          cp ../cv/publications.md publications.md
          if git diff --quiet -- public/ferguson_peter_cv.pdf publications.md; then
            echo "Nothing changed; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ferguson_peter_cv.pdf publications.md
          git commit -m "Update CV and publications from psferguson/cv@${GITHUB_SHA::7}"
          git push
